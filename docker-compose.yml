services:
  web:
    build: .
    volumes:
      - "./:/var/www/html"
      # Exclude vendor, log, and temp by overriding with anonymous volumes
      - "vendor_data:/var/www/html/vendor"
      - "log_data:/var/www/html/log"
      - "temp_data:/var/www/html/temp"
    ports:
      - 8080:80
      - 4443:443
    networks:
      - lamp-docker
    depends_on:
      - db
  db:
    image: mysql:latest
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_czech_ci
    environment:
      MYSQL_DATABASE: iis_winery
      MYSQL_USER: iis_winery
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - "./db:/docker-entrypoint-initdb.d"
    networks:
      - lamp-docker
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8001:80
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    networks:
      - lamp-docker
    depends_on:
      - db
  mailhog:
    image: mailhog/mailhog
    ports:
      - 8025:8025
      - 1025:1025
    networks:
      - lamp-docker
volumes:
  vendor_data:
  log_data:
  temp_data:
networks:
  lamp-docker:
    driver: bridge
